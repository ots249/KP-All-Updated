<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পেজ পাওয়া যায়নি - কারিগরি পাঠশালা</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 1rem;
        }
        .error-container {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        h1 { font-size: 6rem; margin: 0; color: #667eea; }
        p { color: #64748b; margin: 1rem 0; }
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>৪০৪</h1>
        <p>😔 ওহ! পেজটি খুঁজে পাওয়া যায়নি।</p>
        <p>আপনি যে পেজটি খুঁজছেন সেটি সরানো হয়েছে বা ভুল URL দিয়েছেন।</p>
        <a href="/" class="btn">হোম পেইজে ফিরুন</a>
    </div>
</body>
</html>
